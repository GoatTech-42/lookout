# flattened from OpenVulcan config.yml defaults (Vulcan 2.9.7.28)
alerts.click-alert-command-commands=["tp %player%"]
alerts.click-commands=["/vulcan clickalert %player%"]
alerts.console-format=[Vulcan] %player% failed %check% %dev%(Type %type%)%dev% (%vl%/%max-vl%)
alerts.custom-commands=[]
alerts.experimental-symbol=*
alerts.format=%prefix% &f%player% &7failed &f%check% %dev%&7(&fType %type%&7)%dev% &7[&4%vl%&7/&4%max-vl%&7]
alerts.hover-message=["&7Ping: &c%ping% &8| &7TPS: &c%tps% &8| &7Version: &c%version% &8| &7Client: &c%client-brand%", "", "&7Description:", "&7%description%", "", "&7Information:", "&7%info%", "", "&7Click to teleport to &b%player%&7."]
alerts.print-to-console=true
alerts.severity.colors.1=&a
alerts.severity.colors.10=&4
alerts.severity.colors.2=&e
alerts.severity.colors.3=&6
alerts.severity.colors.4=&c
alerts.severity.colors.5=&4
alerts.severity.colors.6=&4
alerts.severity.colors.7=&4
alerts.severity.colors.8=&4
alerts.severity.colors.9=&4
alerts.severity.violations.10=16
alerts.severity.violations.2=4
alerts.severity.violations.3=8
alerts.severity.violations.4=12
alerts.severity.violations.5=16
alerts.severity.violations.6=16
alerts.severity.violations.7=16
alerts.severity.violations.8=16
alerts.severity.violations.9=16
alerts.toggled-off-message=%prefix% &7Vulcan alerts &cdisabled&7!
alerts.toggled-on-message=%prefix% &7Vulcan alerts &aenabled&7!
cancel-hits.cancel-event=false
cancel-hits.checks=[]
cancel-hits.duration=3000
cancel-hits.enabled-for-all-checks=false
