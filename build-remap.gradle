plugins {
	id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
}

repositories {
	maven { url = "https://repo.opencollab.dev/main/" }
	maven { url = "https://repo.viaversion.com/" }
}

dependencies {
	compileOnly "org.geysermc.floodgate:api:2.2.4-SNAPSHOT"
	compileOnly "org.geysermc.geyser:api:2.12.1-20261112.131201-30"
	compileOnly "com.viaversion:viaversion-api:5.12.2"
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "mc", project.mc_range
	inputs.property "java", project.java_min
	filesMatching("fabric.mod.json") { expand "version": project.version, "mc": project.mc_range, "java": project.java_min }
	filesMatching(["meshac.mixins.json", "lookout.mixins.json"]) { expand "java": project.java_min }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.compilerArgs += ["-Xmaxerrs", "10000", "-Xmaxwarns", "10000"] }

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Keep protocol/API seams explicit. Unknown future targets do not inherit a guessed adapter.
def variant = project.minecraft_version.toString()
if (!(variant in ["1.21.11"])) {
    throw new GradleException("No verified source adapter for Minecraft " + variant)
}
sourceSets.main.java.srcDir "src/mc${variant}/java"

if (variant == "1.21.11") {
    // 1.21.11 renames four lookout seams (EntityTypes->EntityType, entityIds()->getEntityIds(),
    // SetEntityMotionPacket.id()->getId(), Gui.chatListener()->Gui.getChat().addMessage).
    // Per-version overrides under src/mc1.21.11 replace the two src/main lookout files for
    // this variant only; other variants keep the reference copies.
    tasks.named("compileJava") {
        source = source.filter { f ->
            def p = f.path.replace(File.separatorChar, '/' as char)
            !p.contains("src/main/java/dev/lookout/mixin/ClientPacketListenerMixin.java") &&
            !p.contains("src/main/java/dev/lookout/mc/ChatAlerter.java")
        }
    }
    // sourcesJar packs every source dir and fails on the duplicate relative paths.
    // Visit the variant dir first so the 1.21.11 copies win; then drop duplicates, but
    // only the two intended override paths may ever duplicate - anything else fails.
    sourceSets.main.java.setSrcDirs([file("src/mc1.21.11/java"), file("src/main/java")])
    tasks.named("sourcesJar") {
        def intended = ["dev/lookout/mixin/ClientPacketListenerMixin.java",
                        "dev/lookout/mc/ChatAlerter.java"] as Set
        def seen = new HashSet()
        def dropped = new HashSet()
        eachFile { cd ->
            if (!seen.add(cd.path)) {
                if (!(cd.path in intended)) {
                    throw new GradleException("sourcesJar: unexpected duplicate source path: " + cd.path)
                }
                dropped.add(cd.path)
            }
        }
        doLast {
            if (dropped != intended) {
                throw new GradleException("sourcesJar: expected exactly the two 1.21.11 override paths to be dropped, got " + dropped)
            }
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

base { archivesName = "meshac-${project.minecraft_version}" }

if (project.java_min.toString() != "21") throw new GradleException("java_min does not match this build route")
