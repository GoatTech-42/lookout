plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
}

repositories {
	maven { url = "https://repo.opencollab.dev/main/" }
	maven { url = "https://repo.viaversion.com/" }
}

dependencies {
	compileOnly "org.geysermc.floodgate:api:2.2.4-SNAPSHOT"
	compileOnly "org.geysermc.geyser:api:2.12.1-20261112.131201-30" // timestamp-pinned snapshot (moving -SNAPSHOT rejected in review)
	compileOnly "com.viaversion:viaversion-api:5.12.2"
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// bundled jar-in-jar: the mod declares mixinextras >=0.5.5 and it is in no
	// nested jar set (26.1.2 binding check H). MIT licence (jar carries
	// LICENSE_MixinExtras), so redistribution inside our jar is permitted.
	include "io.github.llamalad7:mixinextras-fabric:0.5.5"
}

processResources {
	inputs.property "version", project.version
	inputs.property "mc", project.mc_range
	inputs.property "java", project.java_min
	filesMatching("fabric.mod.json") { expand "version": project.version, "mc": project.mc_range, "java": project.java_min }
	filesMatching(["meshac.mixins.json", "lookout.mixins.json"]) { expand "java": project.java_min }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.compilerArgs += ["-Xmaxerrs", "10000", "-Xmaxwarns", "10000"] }

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Keep protocol/API seams explicit. Unknown future targets do not inherit a guessed adapter.
def variant = project.minecraft_version.toString()
if (!(variant in ["26.1.2", "26.2", "26.3"])) {
    throw new GradleException("No verified source adapter for Minecraft " + variant)
}
sourceSets.main.java.srcDir "src/mc${variant}/java"

if (variant == "26.1.2") {
    // 26.1.2 renames three lookout seams (EntityTypes->EntityType, entityIds()->getEntityIds(),
    // Gui.chatListener()->Gui.getChat()). Per-version overrides under src/mc26.1.2 replace the
    // two src/main lookout files for this variant only; other variants keep the reference copies.
    tasks.named("compileJava") {
        source = source.filter { f ->
            def p = f.path.replace(File.separatorChar, '/' as char)
            !p.contains("src/main/java/dev/lookout/mixin/ClientPacketListenerMixin.java") &&
            !p.contains("src/main/java/dev/lookout/mc/ChatAlerter.java")
        }
    }
    // sourcesJar packs every source dir and fails on the duplicate relative paths.
    // Visit the variant dir first so the 26.1.2 copies win; then drop duplicates, but
    // only the two intended override paths may ever duplicate - anything else fails.
    sourceSets.main.java.setSrcDirs([file("src/mc26.1.2/java"), file("src/main/java")])
    tasks.named("sourcesJar") {
        def intended = ["dev/lookout/mixin/ClientPacketListenerMixin.java",
                        "dev/lookout/mc/ChatAlerter.java"] as Set
        def seen = new HashSet()
        def dropped = new HashSet()
        eachFile { cd ->
            if (!seen.add(cd.path)) {
                if (!(cd.path in intended)) {
                    throw new GradleException("sourcesJar: unexpected duplicate source path: " + cd.path)
                }
                dropped.add(cd.path)
            }
        }
        doLast {
            if (dropped != intended) {
                throw new GradleException("sourcesJar: expected exactly the two 26.1.2 override paths to be dropped, got " + dropped)
            }
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

if (variant == "26.2") {
    // 26.2 renames one lookout seam (entityIds()->getEntityIds()). The src/mc26.2 override of
    // ClientPacketListenerMixin replaces the src/main copy for this variant only. ChatAlerter
    // is unaffected: 26.2 keeps Gui.chatListener().
    tasks.named("compileJava") {
        source = source.filter { f ->
            def p = f.path.replace(File.separatorChar, '/' as char)
            !p.contains("src/main/java/dev/lookout/mixin/ClientPacketListenerMixin.java")
        }
    }
    // Same fail-closed sourcesJar handling as 26.1.2, with the single 26.2 override path.
    sourceSets.main.java.setSrcDirs([file("src/mc26.2/java"), file("src/main/java")])
    tasks.named("sourcesJar") {
        def intended = ["dev/lookout/mixin/ClientPacketListenerMixin.java"] as Set
        def seen = new HashSet()
        def dropped = new HashSet()
        eachFile { cd ->
            if (!seen.add(cd.path)) {
                if (!(cd.path in intended)) {
                    throw new GradleException("sourcesJar: unexpected duplicate source path: " + cd.path)
                }
                dropped.add(cd.path)
            }
        }
        doLast {
            if (dropped != intended) {
                throw new GradleException("sourcesJar: expected exactly the 26.2 override path to be dropped, got " + dropped)
            }
        }
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

base { archivesName = "meshac-${project.minecraft_version}" }

if (project.java_min.toString() != "25") throw new GradleException("java_min does not match this build route")
