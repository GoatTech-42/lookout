plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
}

repositories {
	maven { url = "https://repo.opencollab.dev/main/" }
	maven { url = "https://repo.viaversion.com/" }
}

dependencies {
	compileOnly "org.geysermc.floodgate:api:2.2.4-SNAPSHOT"
	compileOnly "org.geysermc.geyser:api:2.12.1-20261112.131201-30" // timestamp-pinned snapshot (moving -SNAPSHOT rejected in review)
	compileOnly "com.viaversion:viaversion-api:5.12.2"
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "mc", project.mc_range
	inputs.property "java", project.java_min
	filesMatching("fabric.mod.json") { expand "version": project.version, "mc": project.mc_range, "java": project.java_min }
	filesMatching("meshac.mixins.json") { expand "java": project.java_min }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.compilerArgs += ["-Xmaxerrs", "10000", "-Xmaxwarns", "10000"] }

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Keep protocol/API seams explicit. Unknown future targets do not inherit a guessed adapter.
def variant = project.minecraft_version.toString()
if (!(variant in ["26.1.2", "26.2", "26.3"])) {
    throw new GradleException("No verified source adapter for Minecraft " + variant)
}
sourceSets.main.java.srcDir "src/mc${variant}/java"

// 26.1.2 carries its own lookout capture layer in src/mc26.1.2 (dev.lookout.mixin
// .ClientPacketListenerMixin and dev.lookout.mc.ChatAlerter). The src/main copies are
// written against 26.3. For this route only, drop the main copies from the compile so
// the per-version ones are the only definitions. Other variants keep using src/main.
if (variant == "26.1.2") {
    tasks.withType(JavaCompile).configureEach { t ->
        t.source = t.source.filter { f ->
            def p = f.path.replace('\\', '/')
            !(p.endsWith('src/main/java/dev/lookout/mixin/ClientPacketListenerMixin.java')
                    || p.endsWith('src/main/java/dev/lookout/mc/ChatAlerter.java'))
        }
    }
    // The sources jar must carry the per-version copies actually compiled, not the 26.3 ones.
    tasks.named('sourcesJar') { t ->
        t.eachFile { fd ->
            def p = fd.file.path.replace('\\', '/')
            if (p.endsWith('src/main/java/dev/lookout/mixin/ClientPacketListenerMixin.java')
                    || p.endsWith('src/main/java/dev/lookout/mc/ChatAlerter.java')) {
                fd.exclude()
            }
        }
    }
}

base { archivesName = "meshac-${project.minecraft_version}" }

if (project.java_min.toString() != "25") throw new GradleException("java_min does not match this build route")
