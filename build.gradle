plugins {
	id "net.fabricmc.fabric-loom" version "${loom_version}"
}

repositories {
	maven { url = "https://repo.opencollab.dev/main/" }
}

dependencies {
	compileOnly "org.geysermc.floodgate:api:2.2.4-SNAPSHOT"
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") { expand "version": project.version, "mc": project.mc_range, "java": project.java_min }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.compilerArgs += ["-Xmaxerrs", "10000", "-Xmaxwarns", "10000"] }

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
